name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-node@v5
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - uses: allure-framework/setup-allurectl@v1
      with:
        allure-endpoint: ${{ secrets.ALLURE_ENDPOINT }}
        allure-token: ${{ secrets.ALLURE_TOKEN }}
        allure-project-id: ${{ secrets.ALLURE_PROJECT_ID }}
    - name: Run Playwright tests
      run: allurectl watch -- npx playwright test
      env:
        ALLURE_ENDPOINT: ${{ secrets.ALLURE_ENDPOINT }}
        ALLURE_TOKEN: ${{ secrets.ALLURE_TOKEN }}
        ALLURE_PROJECT_ID: ${{ secrets.ALLURE_PROJECT_ID }}
        ALLURE_RESULTS: allure-results
        ALLURE_LAUNCH_NAME: "Playwright CI #${{ github.run_number }}"
    - name: Generate Allure report (single file)
      if: always()
      continue-on-error: true
      run: npx allure awesome ./allure-results --single-file
    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v4
      if: always()
      continue-on-error: true
      with:
        name: allure single file
        path: |
          allure-report/index.html
          allure-results
          playwright-report
        retention-days: 90
    - name: Notify Telegram
      if: always()
      run: |
        STATUS="${{ job.status }}"
        EMOJI="${{ job.status == 'success' && '✅' || '❌' }}"
        RUN_LINK="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
          -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
          -d parse_mode="HTML" \
          -d text="${EMOJI} Playwright Tests: ${STATUS}%0A<a href=\"${RUN_LINK}\">Open run</a>"
